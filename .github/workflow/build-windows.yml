name: Build Windows Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name FaceAttendance main.py

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path "dist\FaceAttendance.exe")) {
              Write-Error "FaceAttendance.exe was not created."
              exit 1
          }

          Get-Item "dist\FaceAttendance.exe"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FaceAttendance-Windows
          path: dist/FaceAttendance.exe
          if-no-files-found: error
